services:
  cobot-redis:
    image: redis:7-alpine
    container_name: cobot-redis
    restart: unless-stopped
    ports:
      - "6378:6379"

  cobot-postgres:
    image: postgres:16-alpine
    container_name: cobot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deus_meus_cobot
    ports:
      - "5434:5432"
    volumes:
      - cobot_pgdata:/var/lib/postgresql/data

  cobot-worker:
    build: .
    container_name: cobot-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: cobot-redis
      REDIS_PORT: 6379
      DATABASE_URL: postgres://postgres:postgres@cobot-postgres:5432/deus_meus_cobot
      ANTHROPIC_BASE_URL: http://host.docker.internal:8317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - cobot-redis
      - cobot-postgres

  cobot-smee:
    image: node:20-alpine
    container_name: cobot-smee
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "sh"
      - "-c"
      - "if [ -z \"$$SMEE_URL\" ]; then echo 'SMEE_URL is not set in .env. Waiting...'; sleep infinity; else npx --yes smee-client -u \"$$SMEE_URL\" -t http://host.docker.internal:3000/api/v1/webhook; fi"

volumes:
  cobot_pgdata:
